notes:
- title: Battery Connector
  lines:
  - WARNING!
  - CHECK BATTERY ORIENTATION
  - NO REVERSE POLARITY PROTECTION
- lines:
  - 2.4Ghz External Antenna
  - Optional Antenna Diversity (Max 16)
- lines:
  - USB Micro AB
  - Device/Host/OTG
  - Fully Programable
  - Full Speed (12Mbps)
  - Power Supply (5V)
- lines:
  - Micro SD/HC/XC Card
  - 4 Bit Mode (DEFAULT)
  - 1 Bit Mode (CUT JP3/JP4/JP6)
  - Disabled (CUT JP1-JP6)
- title: Features
  lines:
  - ESP32-MAXIO by Sakura Industries Limited
  - ''
  - ESP32 Wrover-i Module
  - '* CPU : 2 x Xtensa 32-bit LX6 @ 240Mhz'
  - '* SRAM : 520KB'
  - '* Flash :  16MB'
  - '* PSRAM :   8MB'
  - '* WiFi : 2.4Ghz 802.11 b/g/n'
  - '* Bluetooth : v4.2 BR/EDR and BLE'
  - '* ADC : 12-bit SAR ADC up to 18 channels @ 6Khz'
  - '* DAC : 8-bit x 2 @ 6Khz'
  - '* TOUCH : 10 x Capacitive touch sensors'
  - '* SPI:4, I2S:2, I2C:2, UART:3, CAN 2.0:1'
  - '* SD/SDIO/CE-ATA/MMC/eMMC host controller'
  - '* SDIO/SPI slave controller'
  - '* Ethernet MAC interface'
  - '* Infrared remote controller (TX/RX x 8)'
  - '* Motor & LED PWM'
  - '* Termperature and Hall effect Sensors'
  - ''
  - BOOTLOADER
  - '* Simulated Thumb Drive'
  - '* Driverless Drag and drop programming of ESP32 & SAML21'
  - '* Traditional USB serial interface still present'
  - '* I2C IO Expansion Interface for ESP32 to SAML21'
- lines:
  - ''
  - ''
  - Microchip SAML21 IO Coprocessor
  - '* CPU : ARM Cortex M0+ @ 48Mhz'
  - '* SRAM : 40KB'
  - '* FLASH : 264KB'
  - '* Ultra Low Power'
  - '* Timers : 6'
  - '* USB Interface : Device & Host'
  - '* AES Engine & True Random Number Generator'
  - '* 4 x Configurable Custom Logic (CCL) (LUTs)'
  - '* 6 x SERCOMs (UART/SPI/I2C)'
  - '* ADC 12/16 Bit @ 1Msps (10 Channels)'
  - '* DAC 12 Bit @ 1Msps (2 Channels)'
  - '* 3 x OPAMPS'
  - '* 2 x Analog Comparators'
  - '* Real Time Clock'
  - ''
  - ''
  - ''
  - STATUS LEDS
  - '* 4 x RGB Status Leds'
  - '* Neopixel/WS2812B Single Wire Bus'
  - '* LED Bus Header for driving up to 1020 LEDS @ 30fps.'
